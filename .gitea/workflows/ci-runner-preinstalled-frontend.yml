# .gitea/workflows/ci-runner-preinstalled-frontend.yml
# 【Runner 预装】工具供给方式 · 内网 Gitea 实例 前端流水线
#
# ── 与 ci-runner-preinstalled-backend.yml 同方式（镜像供给），但只做【前端】──
#   工具同样烤进 ruoyi/ci-toolchain:TAG 镜像（含 Node + pnpm-standalone + pnpm-store，arm64），
#   流水线调 make -f Makefile.ci frontend-build-img images-frontend 完成：
#     1) frontend-build-img：克隆 Gitee plus-ui，在工具链镜像内用 arm64 Node + 烤入 pnpm 跑 install/build（产出 dist/）；
#     2) images-frontend：docker buildx 把 dist/ 打进 nginx:1.27-alpine 基础镜像（多架构）。
#   最后 docker save ruoyi/plus-ui:TAG → curl PUT 到 Nexus raw 仓。
#
# ── 为什么独立成前端流水线 ──
#   用户要求「前后端各自得流水线」：后端 11 镜像与前端 1 镜像解耦，可分别触发 / 分别发布，
#   职责清晰、互不拖累（前端失败不影响后端已发布的镜像，反之亦然）。
#
# 参考：ci-runner-preinstalled-backend.yml（同方式后端）、runner/Dockerfile、Makefile.ci

name: "RCP 前端·Runner 预装"
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 TAG（须等于 offline-arm-bundle/VERSIONS.env 的 RUOYI_REVISION）'
        required: false
        default: '6.0.0'
      frontend_repo:
        description: "plus-ui 仓库地址"
        required: false
        default: "https://gitee.com/JavaLionLi/plus-ui.git"

jobs:
  build-deploy:
    runs-on: 'ubuntu-latest'   # 指向已加载 ruoyi/ci-toolchain + 各基础镜像的 runner 服务器（arm64）
    env:
      # —— 统一标识符（内网才有，临时用示例值填充；接入时改 env 即可）——
      GITEA_ACTIONS_HOST: "http://32.61.79.150:30003"
      NEXUS_HOST: "http://32.61.79.150:31080"
      IMAGE_REPO_ID: "66306-controlled-048a2fcc35-1"
      REGISTRY_HOST: "registry.internal:5000"
      TAG: ${{ inputs.tag }}
      FRONTEND_REPO: ${{ inputs.frontend_repo }}
      # 已烤好工具链的镜像（ruoyi/ci-toolchain:TAG），须事先 docker load 到本 runner 服务器
      TOOL_IMAGE: "ruoyi/ci-toolchain:${{ inputs.tag }}"
      # 凭据走 secrets（不硬编码）
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}

    steps:
      - name: "克隆代码"
        uses: "http://32.61.79.150:30003/actions/checkout@v4"

      - name: "版本一致性校验（TAG 须等于 VERSIONS.env 的 RUOYI_REVISION）"
        shell: bash
        run: |
          set -euo pipefail
          set -a
          [ -f "$GITHUB_WORKSPACE/offline-arm-bundle/VERSIONS.env" ] && . "$GITHUB_WORKSPACE/offline-arm-bundle/VERSIONS.env"
          set +a
          if [ "${{ inputs.tag }}" != "${RUOYI_REVISION}" ]; then
            echo "✗ TAG 不一致：workflow 输入 ${{ inputs.tag }} ≠ VERSIONS.env 的 ${RUOYI_REVISION}。"; exit 1
          fi
          echo "✓ 版本一致"

      - name: "确认工具镜像已加载（Runner 预装：镜像须事先 docker load 到 runner 服务器）"
        shell: bash
        run: |
          set -euo pipefail
          if docker image inspect "$TOOL_IMAGE" >/dev/null 2>&1; then
            echo "工具镜像已加载：$TOOL_IMAGE"
          else
            echo "::error::$TOOL_IMAGE 未加载。请先在 runner 服务器 docker load ruoyi/ci-toolchain:$TAG（见 script/ci-toolchain-image.sh 与 runner/Dockerfile）。"
            exit 1
          fi

      - name: "确保 docker build 基础镜像（NGINX_IMAGE）已加载（前端 Dockerfile 的 FROM）"
        shell: bash
        run: |
          set -euo pipefail
          set -a
          [ -f "$GITHUB_WORKSPACE/offline-arm-bundle/VERSIONS.env" ] && . "$GITHUB_WORKSPACE/offline-arm-bundle/VERSIONS.env"
          set +a
          IMG="${NGINX_IMAGE}"
          if docker image inspect "$IMG" >/dev/null 2>&1; then
            echo "base image present: $IMG"
          else
            echo "::warning::$IMG 未加载，尝试 REGISTRY_HOST 回退拉取。"
            docker pull "${REGISTRY_HOST}/${IMG}" && docker tag "${REGISTRY_HOST}/${IMG}" "$IMG" || {
              echo "::error::$IMG 未加载且无法拉取。请 docker load build-base-images.tar 到 runner 服务器。"; exit 1
            }
          fi

      - name: "Ensure make（runner 可能未预装）"
        shell: bash
        run: command -v make >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y make; }

      - name: "前端编译 + 构建镜像（make frontend-build-img images-frontend：工具链镜像内跑 pnpm，离线优先）"
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          FRONTEND_REPO: ${{ inputs.frontend_repo }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # 领域逻辑全部在 Makefile.ci：
          #   frontend-build-img（USE_TOOLCHAIN=1 → 工具链镜像内 arm64 Node + 烤入 pnpm 跑 install/build）→ plus-ui/dist/
          #   images-frontend → docker buildx 打 nginx 镜像
          make -f Makefile.ci frontend-build-img images-frontend \
            TAG="${{ inputs.tag }}" \
            FRONTEND_REPO="${{ inputs.frontend_repo }}" \
            PLATFORM=linux/arm64 \
            USE_TOOLCHAIN=1

      - name: "发布前端镜像（docker save → Nexus raw tar）"
        shell: bash
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          IMAGE_REPO_URL="${NEXUS_HOST}/api/zpk/repository/${IMAGE_REPO_ID}"
          IMG_ID=$(head -c12 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c12)
          RUN_TS=$(TZ='Asia/Shanghai' date '+%Y%m%d_%H%M%S')
          image="ruoyi/plus-ui"
          if docker image inspect "$image:$TAG" >/dev/null 2>&1; then
            TAR="ruoyi-plus-ui_${IMG_ID}.tar"
            docker save "$image:$TAG" -o "$TAR"
            ARCHIVE_PATH="${image}/${RUN_TS}/${TAR}"
            echo ">>> 上传 ${ARCHIVE_PATH}"
            curl -fsSL -u "$NEXUS_USER:$NEXUS_PASS" -X PUT -T "$TAR" "${IMAGE_REPO_URL}/${ARCHIVE_PATH}"
            rm -f "$TAR"
            echo "✓ 前端镜像已发布：$image:$TAG"
          else
            echo "::error::$image:$TAG 未构建（make 应已产出）"; exit 1
          fi
