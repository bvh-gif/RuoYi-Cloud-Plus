# .github/workflows/ci-package-backend.yml
# 【压缩包/包供给】工具供给方式 · GitHub 在线 Actions 后端流水线
# （与内网镜像供给 .gitea/workflows/ci-runner-preinstalled-backend.yml 对照）
#
# 工具供给方式 = 包供给（联网环境）：JDK/Maven/Node 等工具由 GitHub 托管的 actions
#   （setup-java / setup-node）按需下载——本质是「工具压缩包」由平台分发；
#   依赖由 Maven 镜像（阿里云公共镜像）在线拉取。本文件是「包供给」在联网 GitHub 环境的实现。
#
# 与内网镜像供给的对照：
#   联网 GitHub（本文件）                    = 工具/依赖都走「包」（setup-java/setup-node + Maven 镜像）
#   内网（ci-runner-preinstalled-backend.yml） = 工具烤进镜像 docker run；依赖用 Nexus 压缩包导入 / 烤入镜像
#
# 说明：ci-make.yml 是 Makefile 驱动的姊妹版，其内部 ci-build 实际走容器化工具链 MVN_IMG/NODE_IMG
#   （属于「镜像供给」在 GitHub 侧的形态）；本文件用 setup-java/setup-node，是更纯粹的「包供给」示范。

name: "ci-package-backend"
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（须与 offline-arm-bundle/VERSIONS.env 的 RUOYI_REVISION 一致）"
        required: false
        default: "6.0.0"
      platform:
        description: "架构：linux/amd64（x86 原生免 QEMU）或 linux/arm64（对齐生产，需 QEMU）"
        required: false
        default: "linux/amd64"
      registry_prefix:
        description: "远端仓库前缀，如 ghcr.io/<owner>/ 或 registry.cn-hangzhou.aliyuncs.com/<ns>/"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag || '6.0.0' }}
      PLATFORM: ${{ inputs.platform || 'linux/amd64' }}
      REGISTRY_PREFIX: ${{ inputs.registry_prefix || format('ghcr.io/{0}/', github.repository_owner) }}

    steps:
      - name: "检出代码"
        uses: actions/checkout@v4

      - name: "安装 JDK 21（Liberica）—— 包供给：工具由 GitHub actions 分发"
        uses: actions/setup-java@v4
        with:
          distribution: "liberica"
          java-version: "21"
          cache: "maven"

      - name: "生成 Maven settings.xml（阿里云公共镜像——依赖走镜像源在线拉取）"
        env:
          MAVEN_MIRROR: "https://maven.aliyun.com/repository/public"
        run: |
          set -euo pipefail
          mkdir -p ~/.m2
          # 不用 heredoc：缩进的 EOF 终结符在 GHA run: 块里会被 bash 误判
          printf '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"\n          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"\n          xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0\n                              https://maven.apache.org/xsd/settings-1.0.0.xsd">\n  <mirrors>\n    <mirror>\n      <id>aliyun-public</id>\n      <name>Aliyun Public Mirror</name>\n      <url>%s</url>\n      <mirrorOf>*</mirrorOf>\n    </mirror>\n  </mirrors>\n</settings>\n' "$MAVEN_MIRROR" > ~/.m2/settings.xml
          echo "=== settings.xml ==="; cat ~/.m2/settings.xml

      - name: "编译（mvn install；依赖来自阿里云镜像，工具来自 setup-java）"
        run: |
          set -euo pipefail
          mvn -DskipTests -B clean install

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Set up QEMU（跨架构构建；原生架构可省略但无害）"
        uses: docker/setup-qemu-action@v3

      - name: "登录镜像仓库（ghcr.io）"
        if: ${{ startsWith(inputs.registry_prefix, 'ghcr.io') }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: "构建并推送 11 个业务镜像（docker buildx build --push）"
        env:
          REGISTRY_PREFIX: ${{ inputs.registry_prefix || format('ghcr.io/{0}/', github.repository_owner) }}
        run: |
          set -euo pipefail
          RUOYI_MODULES=()
          set -a
          [ -f "$GITHUB_WORKSPACE/offline-arm-bundle/VERSIONS.env" ] && . "$GITHUB_WORKSPACE/offline-arm-bundle/VERSIONS.env"
          [ -f "$GITHUB_WORKSPACE/offline-arm-bundle/MODULES.env" ] && . "$GITHUB_WORKSPACE/offline-arm-bundle/MODULES.env"
          set +a
          cd "$GITHUB_WORKSPACE"
          MODULES=("${RUOYI_MODULES[@]}")
          fail=0
          for entry in "${MODULES[@]}"; do
            dir="${entry%%:*}"; image="${entry##*:}"; name="${image#ruoyi/}"
            echo "=============================================================="
            echo "build+push ${REGISTRY_PREFIX}${image}:${TAG}  <- $dir"
            echo "=============================================================="
            if docker buildx build --platform "$PLATFORM" -t "${REGISTRY_PREFIX}${image}:${TAG}" "./$dir" --push; then
              echo "pushed ${REGISTRY_PREFIX}${image}:${TAG}"
            else
              echo "FAIL ${image}"; fail=$((fail + 1))
            fi
          done
          [ "$fail" -eq 0 ]
