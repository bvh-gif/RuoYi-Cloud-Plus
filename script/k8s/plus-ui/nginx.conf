user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    keepalive_requests 100000;

    # 限制 body 大小（上传等）
    client_max_body_size 100m;
    client_header_buffer_size 32k;
    client_body_buffer_size   512k;

    # Gzip 压缩
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 隐藏版本号
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # WebSocket / SSE 兼容的 connection 头
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ===== k8s 关键：后端按 Service 名解析（CoreDNS），不要写 IP / localhost =====
    # 这些名字 = 后端在 k8s 里的 Service 名，必须与后端部署里的 Service metadata.name 一致，
    # 且（默认）处于同一 namespace。跨 namespace 要用全限定名 ruoyi-gateway.<ns>.svc.cluster.local。
    upstream ruoyi-gateway {
        server ruoyi-gateway:8080;
    }
    upstream snailai-server {
        server ruoyi-snailai-server:8900;
    }

    server {
        listen       80;
        # k8s 配合 Ingress；写 _ 匹配任意 Host。固定域名时改这里。
        server_name  _;

        # 禁止外网直接访问 actuator（安全基线，照搬现有 docker nginx）
        location ~ ^(/[^/]*)?/actuator.*(/.*)?$ {
            return 403;
        }

        # SPA history 模式：找不到文件回退 index.html（Vue Router 刷新 404）
        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        # 主 API：走网关。
        # 前端 VITE_APP_BASE_API 默认 /prod-api（相对路径，同源，免 CORS）。
        # proxy_pass 尾斜杠 => 自动剥掉 /prod-api/ 前缀：
        #   /prod-api/auth/login  ->  /auth/login  ->  网关 Path=/auth/** + StripPrefix=1  ->  /login
        # —— 与现有 script/docker/nginx/conf/nginx.conf 的 /prod-api/ 段行为一致。
        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;          # 长连接 / SSE 不超时
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_pass http://ruoyi-gateway/;
        }

        # AI 服务直连（SSE / 流式，绕过网关直连 snailai，保留 /snail-ai/ 前缀）。
        # 与现有 docker nginx 的 /snail-ai/ 段一致；k8s 下同样用 Service 名解析。
        location /snail-ai/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_pass http://snailai-server/snail-ai/;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
