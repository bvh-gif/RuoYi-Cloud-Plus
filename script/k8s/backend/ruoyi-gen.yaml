# ruoyi-gen —— 代码生成服务
# 前置依赖：nacos:8848 + mysql:3306。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-gen
  namespace: ruoyi
  labels:
    app: ruoyi-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-gen
  template:
    metadata:
      labels:
        app: ruoyi-gen
    spec:
      containers:
        - name: ruoyi-gen
          image: ruoyi/ruoyi-gen:6.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9202
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: nacos:8848
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai"
          readinessProbe:
            tcpSocket:
              port: 9202
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9202
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-gen
  namespace: ruoyi
  labels:
    app: ruoyi-gen
spec:
  type: ClusterIP
  selector:
    app: ruoyi-gen
  ports:
    - name: http
      port: 9202
      targetPort: 9202
      protocol: TCP
