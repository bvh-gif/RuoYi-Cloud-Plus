# ruoyi-snailjob-server —— SnailJob 调度服务端（ruoyi-job 依赖它）
# 前置依赖：nacos:8848 + mysql:3306 + redis:6379。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-snailjob-server
  namespace: ruoyi
  labels:
    app: ruoyi-snailjob-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-snailjob-server
  template:
    metadata:
      labels:
        app: ruoyi-snailjob-server
    spec:
      containers:
        - name: ruoyi-snailjob-server
          image: ruoyi/ruoyi-snailjob-server:6.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8800
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: nacos:8848
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai"
          readinessProbe:
            tcpSocket:
              port: 8800
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8800
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-snailjob-server
  namespace: ruoyi
  labels:
    app: ruoyi-snailjob-server
spec:
  type: ClusterIP
  selector:
    app: ruoyi-snailjob-server
  ports:
    - name: http
      port: 8800
      targetPort: 8800
      protocol: TCP
