# ruoyi-system —— 系统服务（被网关/认证依赖，含用户/角色/字典等）
# 前置依赖：nacos:8848 + mysql:3306 + redis:6379。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-system
  namespace: ruoyi
  labels:
    app: ruoyi-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-system
  template:
    metadata:
      labels:
        app: ruoyi-system
    spec:
      containers:
        - name: ruoyi-system
          image: ruoyi/ruoyi-system:6.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9201
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: nacos:8848
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai"
          readinessProbe:
            tcpSocket:
              port: 9201
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9201
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-system
  namespace: ruoyi
  labels:
    app: ruoyi-system
spec:
  type: ClusterIP
  selector:
    app: ruoyi-system
  ports:
    - name: http
      port: 9201
      targetPort: 9201
      protocol: TCP
