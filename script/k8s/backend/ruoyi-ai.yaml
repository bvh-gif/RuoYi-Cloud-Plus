# ruoyi-ai —— AI 服务（依赖 ruoyi-snailai-server）
# 前置依赖：nacos:8848 + mysql:3306 + redis:6379 + ruoyi-snailai-server:8900。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-ai
  namespace: ruoyi
  labels:
    app: ruoyi-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-ai
  template:
    metadata:
      labels:
        app: ruoyi-ai
    spec:
      containers:
        - name: ruoyi-ai
          image: ruoyi/ruoyi-ai:6.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9206
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: nacos:8848
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai"
          readinessProbe:
            tcpSocket:
              port: 9206
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9206
            initialDelaySeconds: 80
            periodSeconds: 15
          resources:
            # AI 服务偏重，按需调大
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-ai
  namespace: ruoyi
  labels:
    app: ruoyi-ai
spec:
  type: ClusterIP
  selector:
    app: ruoyi-ai
  ports:
    - name: http
      port: 9206
      targetPort: 9206
      protocol: TCP
