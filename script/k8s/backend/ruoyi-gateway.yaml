# ============================================================
# ruoyi-gateway —— 网关（所有微服务的统一入口）
# ------------------------------------------------------------
# 前置依赖：同命名空间需有 nacos 这个 Service（nacos:8848），
#           否则 SPRING_CLOUD_NACOS_SERVER_ADDR 解析失败、服务起不来。
# 命名空间统一用 ruoyi，与 plus-ui 的 nginx.conf 里写的 ruoyi-gateway:8080 对应。
# 镜像名必须和 docker-compose 一致：ruoyi/ruoyi-gateway:6.0.0
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-gateway
  namespace: ruoyi
  labels:
    app: ruoyi-gateway
spec:
  replicas: 1            # 网关一般 1~2 副本；多副本注意限流/会话一致性
  selector:
    matchLabels:
      app: ruoyi-gateway
  template:
    metadata:
      labels:
        app: ruoyi-gateway
    spec:
      containers:
        - name: ruoyi-gateway
          image: ruoyi/ruoyi-gateway:6.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: Asia/Shanghai
            # 取代 jar 内烘焙的 @nacos.server@（bridge 网络用的 nacos 服务名）。
            # k8s 里同样用 Service 名 nacos，由 CoreDNS 解析。
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: nacos:8848
            # JVM 跟随容器内存上限（避免默认堆 = 1/4 节点内存把节点吃爆）。
            # 前提：镜像 entrypoint 认 JAVA_OPTS（RuoYi 官方镜像一般认）。
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai"
            # 若项目用了 Nacos 命名空间/分组，补上：
            # - name: SPRING_CLOUD_NACOS_NAMESPACE
            #   value: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
          # 若网关暴露了 /actuator/health，可把下面 tcpSocket 换成 httpGet 更精准
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-gateway
  namespace: ruoyi
  labels:
    app: ruoyi-gateway
spec:
  # ClusterIP 即可：对外入口是 plus-ui 的 Ingress，不会直接暴露网关
  type: ClusterIP
  selector:
    app: ruoyi-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
