# ruoyi-resource —— 资源服务（文件/对象存储等）
# 前置依赖：nacos:8848 + mysql:3306 + redis:6379（按需 rabbitmq）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-resource
  namespace: ruoyi
  labels:
    app: ruoyi-resource
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-resource
  template:
    metadata:
      labels:
        app: ruoyi-resource
    spec:
      containers:
        - name: ruoyi-resource
          image: ruoyi/ruoyi-resource:6.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9204
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SPRING_CLOUD_NACOS_SERVER_ADDR
              value: nacos:8848
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai"
          readinessProbe:
            tcpSocket:
              port: 9204
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9204
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-resource
  namespace: ruoyi
  labels:
    app: ruoyi-resource
spec:
  type: ClusterIP
  selector:
    app: ruoyi-resource
  ports:
    - name: http
      port: 9204
      targetPort: 9204
      protocol: TCP
